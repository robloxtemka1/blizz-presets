<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="referrer" content="no-referrer">
<title>Пресеты</title>
<link rel="stylesheet" href="style.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<div id="app">
  <header class="top"><b>пресеты</b><span class="muted">blizz · sputnik</span></header>
  <div id="err" class="banner hidden"></div>
  <section class="card" id="head">
    <div class="row">
      <select id="sel" class="in sel"></select>
      <span id="cnt" class="muted small"></span>
    </div>
    <input id="name" class="in name" maxlength="40" autocomplete="off">
    <div id="namehint" class="hint"></div>
    <div class="row gap">
      <button id="bnew" class="bt">+ новый</button>
      <button id="bcopy" class="bt">копия</button>
      <button id="bdel" class="bt danger">удалить</button>
    </div>
    <div class="row between">
      <span class="muted">активный для скана и /parse_ca</span>
      <span id="tgl" class="toggle" role="switch" tabindex="0"><span class="knob"></span></span>
    </div>
    <div id="headhint" class="hint"></div>
  </section>
  <div id="groups"></div>
  <div class="spacer"></div>
</div>
<div class="savebar">
  <button id="save" class="save">сохранить пресет</button>
  <div id="status" class="status">изменений нет</div>
</div>
<div id="modal" class="modal hidden" role="dialog" aria-modal="true">
  <div class="card mcard">
    <div class="muted tiny upper">пример</div>
    <div id="mtitle" class="mtitle"></div>
    <div id="mtext" class="box"></div>
    <button id="mok" class="bt wide">понятно</button>
  </div>
</div>
<div id="debug" class="card hidden">
  <div class="muted small">Страница открыта не из Telegram — данные, которые ушли бы боту:</div>
  <textarea id="dbgtext" class="in dbg" readonly></textarea>
</div>
<script src="fields.js"></script>
<script src="app.js"></script>
</body>
</html>
